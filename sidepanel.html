<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sidekick</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #17181d;
      color: #e8e8ec;
    }

    * { box-sizing: border-box; }

    body {
      width: 100%;
      min-width: 320px;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      background: #17181d;
    }

    button, input, select, textarea { font: inherit; }
    button { color: inherit; }

    .header {
      height: 66px;
      flex: 0 0 66px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0 18px;
      border-bottom: 1px solid #34353d;
    }

    .brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; }
    .brand-mark {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: #30394c;
      color: #f3f4f8;
    }

    main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 16px 18px 14px;
    }
    [hidden] { display: none !important; }
    h1 { margin: 0 0 6px; font-size: 21px; letter-spacing: -.3px; }
    p { margin: 0; color: #a4a5b1; line-height: 1.5; font-size: 13px; }
    .field { display: block; margin: 0 0 12px; }
    .field span { display: block; margin-bottom: 6px; color: #b7b8c2; font-size: 12px; }
    textarea {
      width: 100%;
      border: 1px solid #3b3d48;
      border-radius: 10px;
      outline: none;
      background: #22242c;
      color: #f0f0f3;
      padding: 10px 12px;
    }
    textarea { min-height: 72px; resize: vertical; line-height: 1.5; }
    textarea:focus { border-color: #8c8ff6; }
    .primary-button {
      min-height: 40px;
      padding: 9px 14px;
      border: 0;
      border-radius: 10px;
      background: #7378df;
      color: #fff;
      font-weight: 650;
      cursor: pointer;
    }
    .primary-button:hover { background: #8589ed; }
    .primary-button:disabled { opacity: .6; cursor: wait; }
    #askView { display: flex; flex: 1; flex-direction: column; min-height: 0; }
    .chat-history {
      flex: 1;
      min-height: 0;
      margin: 14px 0 10px;
      overflow-y: auto;
      border-radius: 10px;
      color: #e1e1e8;
      font-size: 13px;
      line-height: 1.6;
    }
    .chat-message { margin: 0 0 10px; padding: 10px; border-radius: 9px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .chat-message.user { margin-left: 24px; background: #343749; }
    .chat-message.assistant { margin-right: 12px; background: #2b2d36; }
    .jump-button {
      display: block;
      width: 100%;
      margin-top: 9px;
      padding: 9px 10px;
      border: 0;
      border-radius: 8px;
      background: #393b4a;
      color: #eeeef5;
      text-align: left;
      cursor: pointer;
    }
    .jump-button:hover { background: #4a4d61; }
    .ask-form { display: flex; flex-direction: column; gap: 8px; }
    .status { min-height: 18px; margin-top: 10px; color: #b9b9c5; font-size: 12px; }
    .status:empty { display: none; }
    .status.error { color: #ff9a9a; }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <rect x="4" y="6" width="16" height="13" rx="4" stroke="currentColor" stroke-width="2"/>
          <path d="M9 4v2m6-2v2M8 12h.01M16 12h.01M9 16h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <span>Sidekick</span>
    </div>
  </header>

  <main id="mainContent">
    <section class="view" id="askView">
      <h1>Ask AI</h1>
      <p>Ask a question about the current webpage.</p>
      <div class="chat-history" id="askResult" role="log" aria-live="polite"></div>
      <form id="askForm" class="ask-form">
        <label class="field" for="askInput">
          <span>Your question</span>
          <textarea id="askInput" rows="2" placeholder="Ask anything about this page..." required></textarea>
        </label>
        <button class="primary-button" id="askButton" type="submit">Ask AI</button>
      </form>
    </section>
  </main>

  <div class="status" id="globalStatus" role="status" aria-live="polite" style="padding:0 18px"></div>
  <script src="sidepanel.js"></script>
</body>
</html>
